[project]
name = "mindclade-monorepo"
version = "0.0.0"
description = "Mindclade polyglot monorepo Python workspace root"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "sdk/python",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.4",
]
cpu = []
gpu = []
docs = []
release = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
".buildkite/**" = ["E402"]
"models/api/model.py" = ["F821"]
"training/api/engine.py" = ["F821"]
"training/api/task.py" = ["F821"]
