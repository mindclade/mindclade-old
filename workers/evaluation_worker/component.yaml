apiVersion: mindclade.dev/v1
kind: Worker
metadata:
  name: evaluation-worker
  owner: ml-evaluation
spec:
  maturity: experimental
  tier: 2
  languages: [python]
  buildTargets:
    - //workers/evaluation_worker/...
  testTargets:
    - //workers/evaluation_worker/...
  artifacts:
    - type: oci
      name: evaluation-worker
  protocols:
    - mindclade.evaluation.v1
    - mindclade.artifact.v1
  dataClassifications:
    - internal
    - restricted-biological
  runtime:
    kubernetes: true
    gpu: true
