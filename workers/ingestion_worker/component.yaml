apiVersion: mindclade.dev/v1
kind: Worker
metadata:
  name: ingestion-worker
  owner: data-platform
spec:
  maturity: experimental
  tier: 2
  languages: [rust]
  buildTargets:
    - //workers/ingestion_worker/...
  testTargets:
    - //workers/ingestion_worker/...
  artifacts:
    - type: oci
      name: ingestion-worker
  protocols:
    - mindclade.dataset.v1
    - mindclade.artifact.v1
  dataClassifications:
    - internal
    - restricted-biological
  runtime:
    kubernetes: true
    gpu: false
